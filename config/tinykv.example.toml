# =============================================================================
# TinyKVCache 配置文件示例
# =============================================================================
#
# 配置优先级建议：
#     内置默认值 < TOML 配置文件 < 命令行参数
#
# 启动示例：
#     ./tinykv_server --config config/tinykv.toml
#
# 命令行参数可以覆盖配置文件中的对应配置：
#     ./tinykv_server --config config/tinykv.toml --port 7777 --log-level debug
#
# 单位约定：
#     *_bytes    : 字节
#     *_ms       : 毫秒
#
# =============================================================================


# =============================================================================
# Server
# =============================================================================
#
# TCP Server 和 Reactor 架构相关配置。
#
[server]


# 服务监听地址。
#
# 常见配置：
#     "127.0.0.1"：只监听本机连接，适合本地开发和调试。
#     "0.0.0.0"：监听所有 IPv4 网卡，适合容器、虚拟机以及远程服务器部署。
#
# 注意：TinyKVCache 当前没有认证和 TLS 加密能力，不建议直接暴露在不可信的公网环境中。
#
host = "0.0.0.0"


# TCP 服务监听端口。
#
# 有效范围：1 ~ 65535
# Unix/Linux 系统中，1024 以下端口通常需要额外权限。
#
port = 7777


# =============================================================================
# Reactor 配置
# =============================================================================
#
# Reactor 架构相关配置
[reactor]

# I/O 多路复用后端。
#
# 支持：
#     "auto"：根据当前平台自动选择 Poller。
#     "poll"：使用 POSIX poll。跨平台兼容性较好，适合开发和性能对比。
#     "epoll"：使用 Linux epoll。推荐 Linux 生产环境使用。
#
# 推荐：
#     macOS 开发："auto" 或 "poll"
#     Linux 部署："auto" 或 "epoll"
#
poller = "auto"


# Sub Reactor 数量。
#
# 当前 TinyKVCache 采用：Main Reactor + N 个 Sub Reactor
#
# Main Reactor 负责：
#     - listen socket
#     - accept 新连接
#     - 将连接分配给 Sub Reactor
#     - 服务生命周期管理
#
# Sub Reactor 负责：
#     - client socket 读写
#     - FrameCodec 协议解析
#     - CommandParser
#     - CommandExecutor
#     - Backpressure
#     - Connection 生命周期
#
# 约定：
#     0：自动计算 Sub Reactor 数量。
#     1 ~ 16：手动指定 Sub Reactor 数量。
#
# 当前架构下多个 Sub Reactor 仍然共享同一个 KVStore，因此 Reactor 数量并不是越多越好。
#
# 推荐默认：
#     0 = auto
#
sub_reactors = 0

# =============================================================================
# Network
# =============================================================================
#
# 网络缓冲区、背压和 Reactor 公平性相关参数。
#
[network]


# 单个连接允许保留的最大读缓冲区大小。
#
# TinyKVCache 协议采用：4 字节长度字段 + payload，因此该值至少必须大于等于 4。
#
# 当一个连接的 readBuffer 达到该限制后，服务会认为请求过大或客户端行为异常，并拒绝继续读取。
#
# 示例：
#     1 MiB + 4 字节协议头 = 1024 * 1024 + 4 = 1048580
#
max_read_buffer_bytes = 1048580


# -----------------------------------------------------------------------------
# 写缓冲区背压
# -----------------------------------------------------------------------------
#
# 每个 Connection 都维护一个用户态 writeBuffer。
#
# 如果客户端读取响应速度过慢，writeBuffer 中尚未发送的数据会持续增加。
#
# Backpressure 的作用是防止：
#      慢客户端
#         ↓
#     writeBuffer 无限增长
#         ↓
#     服务端内存不断增加
#
# 三个参数必须满足：
#     write_low_watermark_bytes
#         <=
#     write_high_watermark_bytes
#         <=
#     write_hard_limit_bytes
#


# 写缓冲区高水位。
#
# 当 pending write bytes 大于等于该值时：暂停读取该客户端的新请求
# 即：Read interest 暂时移除
#
# 推荐：1 MiB = 1024 * 1024 = 1048576
#
write_high_watermark_bytes = 1048576


# 写缓冲区低水位。
#
# 当连接已经因为高水位而暂停读取，
# 且 pending write bytes 降低到该值以下时：恢复读取该客户端的新请求
#
# 使用：Low Watermark < High Watermark 可以形成滞回区间，避免 Read 状态在临界值附近反复切换。
#
# 推荐：
#     512 KiB = 512 * 1024 = 524288
#
write_low_watermark_bytes = 524288


# 单个连接写缓冲区的绝对上限。
#
# 如果加入一个新的 response 后会超过该值：TinyKVCache 将该连接视为 slow client并主动关闭连接
# 
# 用于防止：
#     - 客户端长期不读取响应
#     - 单连接占用大量内存
#     - 恶意 slow-reader 攻击
# 推荐：
#     4 MiB = 4 * 1024 * 1024 = 4194304
#
write_hard_limit_bytes = 4194304


# 单次 Reactor Write Ready 事件允许发送的最大字节数。
#
# 这个参数不是 socket buffer 大小，而是 Reactor 的公平性预算。
#
# 如果一个连接有非常大的 writeBuffer，不应让它一次性占用 Sub Reactor 太长时间，否则会增加其他客户端的延迟。
#
# 推荐：
#     64 KiB = 64 * 1024 = 65536
#
max_write_bytes_per_event = 65536


# Main Reactor 一次 listen Read Ready 事件中，最多允许 accept 的连接数量。
#
# poll/epoll 通知 listen fd 可读时，accept queue 中可能已经存在大量客户端。
#
# 如果一次无限 accept：
#     新连接洪峰
#         ↓
#     Main Reactor 长时间执行 accept
#         ↓
#     其他控制事件延迟
#
# 因此需要限制每轮 accept 的工作量。
#
# 推荐：
#     64
#
max_accepts_per_event = 64



# =============================================================================
# Graceful Shutdown
# =============================================================================
#
# TinyKVCache 生命周期：
#     Running
#         ↓
#     Draining
#         ↓
#     Stopped
#
# Draining 阶段：
#     不再 accept 新连接
#     不再读取新的客户端请求
#     继续发送已经排队的响应
#
# 这样可以避免：
#     command 已经执行成功
#         ↓
#     server 立即退出
#         ↓
#     response 没有发送给客户端
#
[shutdown]


# Graceful Shutdown 最大等待时间，单位毫秒
#
# 超过该时间后，仍然没有排空的客户端连接，则强制关闭
# 示例：
#     5000 = 5 秒
#
graceful_timeout_ms = 5000



# =============================================================================
# TTL
# =============================================================================
#
# TinyKVCache 的过期 Key 采用：
#
#     Lazy Expiration
#         +
#     Background Sweeper
#
# Lazy Expiration：
#     GET / TTL 等访问 Key 时，如果发现已经过期，则立即删除。
#
# Background Sweeper：
#     后台线程周期性扫描并删除已经过期的 Key。
#
[ttl]


# 后台 Sweeper 的执行周期，单位毫秒
#
# 示例：
#     1000: 大约每 1 秒执行一次
#     5000: 大约每 5 秒执行一次
# 周期越短：
#     优点：过期 Key 会更快被清理
#     缺点：Sweeper 更频繁访问 KVStore
# 周期越长：
#     优点：后台维护开销更低
#     缺点：已经过期的 Key 可能在内存中保留更长时间
# 推荐：
#     5秒
#
sweep_interval_ms = 5000



# =============================================================================
# Logging
# =============================================================================
#
# 日志相关配置。
#
[logging]


# 最低日志等级。
#
# 支持：
#     "debug"：调试日志。信息最详细，适合开发和问题排查。
#     "info"：普通运行日志。包括服务启动、停止、连接建立等。
#     "warn"：非致命异常或潜在问题。
#     "error"：严重错误。
#
# 推荐：
#     开发环境：debug
#     正常运行：info
#     高负载性能测试：warn / error
#
# 不建议在高并发生产环境长期使用 debug，因为日志格式化、mutex 竞争和输出 I/O，都可能影响吞吐量和 P99 延迟。
#
level = "info"
